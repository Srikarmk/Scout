app = "scout-srikarmk"
primary_region = "bos"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  # A research run takes 5-20 minutes and holds an SSE stream open. Suspending
  # the machine on idle would kill in-flight runs and drop the registry, so the
  # machine stays up.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

# Reports and the shortlist are written to disk; keep them across deploys.
[[mounts]]
  source = "scout_data"
  destination = "/app/.scout"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
